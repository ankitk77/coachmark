name: Publish

on:
  release:
    types: [ published ]

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate publish secrets
        env:
          OSS_USERNAME: ${{ secrets.OSS_USERNAME || secrets.OSSRH_USERNAME }}
          OSS_PASSWORD: ${{ secrets.OSS_PASSWORD || secrets.OSSRH_PASSWORD }}
          OSS_STAGING_PROFILE_ID: ${{ secrets.OSS_STAGING_PROFILE_ID || secrets.OSSRH_STAGING_PROFILE_ID }}
          OSS_SIGNING_PASSWORD: ${{ secrets.OSS_SIGNING_PASSWORD || secrets.SIGNING_PASSWORD }}
          OSS_SIGNING_KEY: ${{ secrets.OSS_SIGNING_KEY || secrets.SIGNING_KEY }}
        run: |
          test -n "$OSS_USERNAME" || { echo "Missing OSS_USERNAME or OSSRH_USERNAME secret"; exit 1; }
          test -n "$OSS_PASSWORD" || { echo "Missing OSS_PASSWORD or OSSRH_PASSWORD secret"; exit 1; }
          test -n "$OSS_STAGING_PROFILE_ID" || { echo "Missing OSS_STAGING_PROFILE_ID or OSSRH_STAGING_PROFILE_ID secret"; exit 1; }
          test -n "$OSS_SIGNING_PASSWORD" || { echo "Missing OSS_SIGNING_PASSWORD or SIGNING_PASSWORD secret"; exit 1; }
          test -n "$OSS_SIGNING_KEY" || { echo "Missing OSS_SIGNING_KEY or SIGNING_KEY secret"; exit 1; }
          echo "Signing key length: ${#OSS_SIGNING_KEY}"
          [[ "$OSS_SIGNING_KEY" == *"BEGIN PGP PRIVATE KEY BLOCK"* ]] || { echo "Signing key is not a PGP private key"; exit 1; }
          [[ "$OSS_SIGNING_KEY" == *"END PGP PRIVATE KEY BLOCK"* ]] || { echo "Signing key is missing the PGP private key footer"; exit 1; }

      - name: Publish Artifact to Sonatype
        env:
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          OSS_USERNAME: ${{ secrets.OSS_USERNAME || secrets.OSSRH_USERNAME }}
          OSS_PASSWORD: ${{ secrets.OSS_PASSWORD || secrets.OSSRH_PASSWORD }}
          OSS_STAGING_PROFILE_ID: ${{ secrets.OSS_STAGING_PROFILE_ID || secrets.OSSRH_STAGING_PROFILE_ID }}
          OSS_SIGNING_KEY_ID: ${{ secrets.OSS_SIGNING_KEY_ID || secrets.SIGNING_KEY_ID }}
          OSS_SIGNING_PASSWORD: ${{ secrets.OSS_SIGNING_PASSWORD || secrets.SIGNING_PASSWORD }}
          OSS_SIGNING_KEY: ${{ secrets.OSS_SIGNING_KEY || secrets.SIGNING_KEY }}
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository --stacktrace
